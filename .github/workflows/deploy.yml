# ينشر الموقع على GitHub Pages تلقائياً كل ما ترفع تعديل على main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee build.log

      # إذا فشل البناء، الأخطاء تطلع بصفحة الـ run حتى تنقرأ بسهولة
      - name: Show build errors
        if: failure()
        shell: bash
        run: grep -E "Error|error" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
